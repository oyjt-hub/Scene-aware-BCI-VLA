[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scene-context-intent"
version = "0.1.0"
description = "Bounded-task scene/BCI intent inference and fair offline comparisons"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
neural = ["torch>=2.2", "numpy>=1.24"]

[project.scripts]
scene-context = "scene_context.cli:main"

[tool.setuptools.packages.find]
include = ["scene_context*"]
